[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branch_extended_AD"
version = "0.1.0"
description = "Branch-extended automatic differentiation for JAX functions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Jan Hückelheim", email = "jhueckelheim@anl.gov"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "jax",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/POptUS/branch_extended_AD"

[tool.setuptools.packages.find]
include = ["branch_extended_AD*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
